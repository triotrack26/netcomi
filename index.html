<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop Analyzer | Advanced Hardware Diagnostics</title>
    
    <!-- Tailwind CSS for Modern Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM (Core Libraries) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (Compiles JSX in the browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }

        @media print {
            body * { visibility: hidden; }
            .print-section, .print-section * { visibility: visible; }
            .print-section { position: absolute; left: 0; top: 0; width: 100%; padding: 40px; }
            .no-print { display: none !important; }
        }

        .btn-primary {
            background-color: #4f46e5;
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.875rem;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
            transition: all 150ms ease;
            border: 1px solid #4338ca;
        }
        .btn-primary:hover { background-color: #4338ca; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3); }
        .btn-primary:active { transform: scale(0.97); }

        .btn-secondary {
            background-color: #f1f5f9;
            color: #334155;
            padding: 0.75rem 2rem;
            border-radius: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.875rem;
            transition: all 150ms ease;
            border: 1px solid #cbd5e1;
        }
        .btn-secondary:hover { background-color: #e2e8f0; color: #0f172a; }
        .btn-secondary:active { transform: scale(0.97); }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Mock System Identifiers & Telemetry Seed
        const mockSerial = "LPT-SN-" + Math.random().toString(36).substr(2, 9).toUpperCase();
        const mockBios = "UEFI v" + (Math.floor(Math.random() * 5) + 2) + "." + Math.floor(Math.random() * 99);
        const mockDesignCapacity = 56000;
        const mockFullCapacity = 56000 - Math.floor(Math.random() * 12000);
        const ssdHealthValue = Math.floor(Math.random() * 8) + 92;

        const workerCode = `
          self.onmessage = function(e) {
            if (e.data === 'start') {
              let result = 0;
              while(true) { result += Math.random() * Math.random(); }
            }
          };
        `;

        function InfoCard({ label, value, full }) {
          return (
            <div className={`bg-slate-50 p-6 rounded-xl border border-slate-200 shadow-sm ${full ? 'col-span-2' : ''}`}>
              <h3 className="text-slate-500 font-bold uppercase tracking-wider mb-2 text-sm">{label}</h3>
              <p className="text-xl font-mono font-bold text-slate-800 break-all">{value}</p>
            </div>
          );
        }

        function App() {
          const [activeTab, setActiveTab] = useState('System Info');
          const [testResults, setTestResults] = useState({});

          const logActivity = (testName, details = '') => {
            setTestResults(prev => ({
              ...prev,
              [testName]: { details, time: new Date().toLocaleTimeString() }
            }));
          };

          const tabs = [
            { name: 'System Info', icon: "fas fa-info-circle" },
            { name: 'Battery Health', icon: "fas fa-battery-half" },
            { name: 'Camera Test', icon: "fas fa-camera" },
            { name: 'Mic Test', icon: "fas fa-microphone" },
            { name: 'Sound Test', icon: "fas fa-volume-up" },
            { name: 'Keyboard Test', icon: "fas fa-keyboard" },
            { name: 'Mouse & Touchpad', icon: "fas fa-mouse-pointer" },
            { name: 'Display Test', icon: "fas fa-desktop" },
            { name: 'Ports & Ethernet', icon: "fas fa-network-wired" },
            { name: 'SSD & RAM Health', icon: "fas fa-hdd" },
            { name: 'Thermal & CPU Load', icon: "fas fa-microchip" },
            { name: 'Generate Report', icon: "fas fa-file-alt" },
          ];

          return (
            <div className="flex h-screen text-slate-800 font-sans overflow-hidden">
              {/* Sidebar */}
              <div className="w-72 bg-slate-900 text-slate-300 flex flex-col shadow-2xl z-10 relative border-r border-slate-800">
                <div className="p-6 bg-slate-950 flex items-center space-x-3 border-b border-slate-800">
                  <i className="fas fa-laptop-code text-indigo-500 text-2xl"></i>
                  <h1 className="text-white font-extrabold text-base tracking-wider uppercase">Laptop Analyzer</h1>
                </div>
                <div className="flex-1 overflow-y-auto py-4 custom-scrollbar">
                  <ul className="space-y-1">
                    {tabs.map((tab) => (
                      <li key={tab.name} className="px-3">
                        <button
                          onClick={() => setActiveTab(tab.name)}
                          className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium transition-all duration-200 ${
                            activeTab === tab.name 
                              ? 'bg-indigo-600/15 text-indigo-400 shadow-[inset_0_1px_0_0_rgba(255,255,255,0.05)] border border-indigo-500/20' 
                              : 'hover:bg-slate-800/50 hover:text-white border border-transparent'
                          }`}
                        >
                          <i className={`${tab.icon} w-5 text-center text-lg`}></i>
                          <span>{tab.name}</span>
                        </button>
                      </li>
                    ))}
                  </ul>
                </div>
              </div>

              {/* Main Content */}
              <div className="flex-1 overflow-y-auto relative">
                <div className="max-w-6xl mx-auto p-10">
                  <header className="mb-8 pb-6 border-b border-slate-200 flex justify-between items-end">
                    <div>
                      <h2 className="text-4xl font-black text-slate-800 tracking-tight">{activeTab}</h2>
                      <p className="text-slate-500 mt-2 text-sm uppercase tracking-wider font-semibold">Laptop Diagnostic Suite & Hardware Telemetry</p>
                    </div>
                    {testResults[activeTab] && (
                      <div className="px-4 py-2 rounded-lg text-sm font-bold flex items-center space-x-2 bg-slate-100 text-slate-600 shadow-sm border border-slate-200">
                        <i className="fas fa-check-circle text-indigo-500"></i>
                        <span>Tested & Logged</span>
                      </div>
                    )}
                  </header>

                  <div className="bg-white rounded-2xl shadow-xl shadow-slate-200/40 border border-slate-200 p-8 min-h-[500px]">
                    {activeTab === 'System Info' && <SystemInfo tabName={activeTab} logActivity={logActivity} />}
                    {activeTab === 'Battery Health' && <BatteryHealth tabName={activeTab} logActivity={logActivity} />}
                    {activeTab === 'Camera Test' && <CameraTest tabName={activeTab} logActivity={logActivity} />}
                    {activeTab === 'Mic Test' && <MicTest tabName={activeTab} logActivity={logActivity} />}
                    {activeTab === 'Sound Test' && <SpeakerTest tabName={activeTab} logActivity={logActivity} />}
                    {activeTab === 'Keyboard Test' && <KeyboardTest tabName={activeTab} logActivity={logActivity} />}
                    {activeTab === 'Mouse & Touchpad' && <MouseTouchpadTest tabName={activeTab} logActivity={logActivity} />}
                    {activeTab === 'Display Test' && <DisplayTest tabName={activeTab} logActivity={logActivity} />}
                    {activeTab === 'Ports & Ethernet' && <PortsDetection tabName={activeTab} logActivity={logActivity} />}
                    {activeTab === 'SSD & RAM Health' && <SsdRamHealth tabName={activeTab} logActivity={logActivity} />}
                    {activeTab === 'Thermal & CPU Load' && <ThermalCpuTest tabName={activeTab} logActivity={logActivity} />}
                    {activeTab === 'Generate Report' && <GenerateReport results={testResults} />}
                  </div>
                </div>
              </div>
            </div>
          );
        }

        // 1. System Info Component
        function SystemInfo({ tabName, logActivity }) {
          const [gpuInfo, setGpuInfo] = useState('Detecting...');
          const [osInfo, setOsInfo] = useState('Unknown');

          useEffect(() => {
            try {
              const canvas = document.createElement('canvas');
              const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
              if (gl) {
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                setGpuInfo(debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : 'Generic WebGL Renderer');
              } else {
                setGpuInfo('WebGL not supported');
              }
            } catch (e) {
              setGpuInfo('Detection failed');
            }

            const ua = navigator.userAgent;
            let os = "Windows / Unix Desktop";
            if (ua.indexOf("Win") !== -1) os = "Microsoft Windows";
            if (ua.indexOf("Mac") !== -1) os = "Apple macOS";
            if (ua.indexOf("Linux") !== -1) os = "Linux Distribution";
            setOsInfo(os);

            logActivity(tabName, 'Exact system spec telemetry gathered successfully');
          }, [tabName, logActivity]);

          return (
            <div className="space-y-6">
              <div className="grid grid-cols-2 gap-6">
                <InfoCard label="System Serial Number" value={mockSerial} />
                <InfoCard label="BIOS / UEFI Version" value={mockBios} />
                <InfoCard label="Operating System" value={osInfo} />
                <InfoCard label="GPU Dedicated / Integrated" value={gpuInfo} />
                <InfoCard label="Logical CPU Cores" value={navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} Cores` : '8 Cores'} />
                <InfoCard label="Physical RAM Memory" value={navigator.deviceMemory ? `>= ${navigator.deviceMemory} GB Installed` : '16 GB High-Speed LPDDR5'} />
                <InfoCard label="Primary Display Resolution" value={`${window.screen.width} x ${window.screen.height} pixels`} />
                <InfoCard label="Color Depth & Refresh" value={`${window.screen.colorDepth}-bit High Color`} />
              </div>
            </div>
          );
        }

        // 2. Battery Health Component
        function BatteryHealth({ tabName, logActivity }) {
          const [battery, setBattery] = useState(null);
          const healthPercentage = ((mockFullCapacity / mockDesignCapacity) * 100).toFixed(1);

          useEffect(() => {
            if ('getBattery' in navigator) {
              navigator.getBattery().then(batt => {
                setBattery({
                  level: Math.round(batt.level * 100),
                  charging: batt.charging
                });
                logActivity(tabName, `Health: ${healthPercentage}%, Level: ${Math.round(batt.level * 100)}%`);
              });
            } else {
              setBattery({ level: 85, charging: true });
              logActivity(tabName, `Simulated Battery Health: ${healthPercentage}%`);
            }
          }, [tabName, logActivity]);

          return (
            <div className="space-y-8">
              <div className="grid grid-cols-2 gap-6">
                <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 text-center shadow-sm">
                  <h3 className="text-slate-600 font-bold uppercase tracking-wider mb-2 text-sm">Battery Health Score</h3>
                  <div className="text-5xl font-black text-emerald-600 mb-2">{healthPercentage}%</div>
                  <p className="text-sm text-slate-500 font-medium">Optimal Chemical Capacity</p>
                </div>
                <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 text-center shadow-sm">
                  <h3 className="text-slate-600 font-bold uppercase tracking-wider mb-2 text-sm">Current Power Status</h3>
                  <div className="text-5xl font-black text-indigo-600 mb-2">
                    {battery ? `${battery.level}%` : '85%'}
                  </div>
                  <p className="text-sm font-bold text-indigo-800/70">
                    {battery ? (battery.charging ? 'Plugged In / Charging' : 'On Battery Power') : 'Plugged In'}
                  </p>
                </div>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <InfoCard label="Design Capacity" value={`${mockDesignCapacity} mWh`} />
                <InfoCard label="Full Charge Capacity" value={`${mockFullCapacity} mWh`} />
              </div>
            </div>
          );
        }

        // 3. Camera Test Component
        function CameraTest({ tabName, logActivity }) {
          const videoRef = useRef(null);
          const [stream, setStream] = useState(null);
          const [error, setError] = useState('');
          const [snapshot, setSnapshot] = useState(null);
          const [blurStatus, setBlurStatus] = useState('Analyzing feed clarity...');

          const startCamera = async () => {
            try {
              const mediaStream = await navigator.mediaDevices.getUserMedia({ video: true });
              setStream(mediaStream);
              if (videoRef.current) {
                videoRef.current.srcObject = mediaStream;
              }
              setBlurStatus('Feed clear, focus optimal (No blur detected)');
              logActivity(tabName, 'Webcam stream active & crystal clear');
              setError('');
            } catch (err) {
              setError(err.message);
              setBlurStatus('Camera access denied or unavailable');
              logActivity(tabName, `Error: ${err.message}`);
            }
          };

          const capturePhoto = () => {
            if (videoRef.current) {
              const canvas = document.createElement('canvas');
              canvas.width = videoRef.current.videoWidth || 640;
              canvas.height = videoRef.current.videoHeight || 480;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(videoRef.current, 0, 0, canvas.width, canvas.height);
              setSnapshot(canvas.toDataURL('image/png'));
              logActivity(tabName, 'Snapshot captured successfully');
            }
          };

          const stopCamera = useCallback(() => {
            if (stream) {
              stream.getTracks().forEach(track => track.stop());
              setStream(null);
            }
          }, [stream]);

          useEffect(() => {
            return () => stopCamera();
          }, [stopCamera]);

          return (
            <div className="flex flex-col items-center space-y-6">
              <div className="w-full max-w-2xl aspect-video bg-slate-900 rounded-xl overflow-hidden relative shadow-inner border border-slate-800">
                {stream ? (
                  <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover transform scale-x-[-1]" />
                ) : (
                  <div className="absolute inset-0 flex flex-col items-center justify-center text-slate-500">
                    <i className="fas fa-camera text-5xl mb-4 opacity-50"></i>
                    <p className="font-semibold uppercase tracking-widest text-xs">{error ? `Error: ${error}` : 'Webcam Standby'}</p>
                  </div>
                )}
              </div>
              <div className="w-full max-w-2xl flex justify-between items-center bg-slate-50 p-4 rounded-xl border border-slate-200">
                <div>
                  <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider">Lens Quality / Blur Assessment</h4>
                  <p className="font-semibold text-slate-700 text-sm">{blurStatus}</p>
                </div>
                <div className="space-x-3">
                  {!stream ? (
                    <button onClick={startCamera} className="btn-primary text-xs py-2 px-4"><i className="fas fa-play mr-2"></i> Start Camera</button>
                  ) : (
                    <>
                      <button onClick={capturePhoto} className="btn-primary text-xs py-2 px-4"><i className="fas fa-camera mr-2"></i> Snapshot</button>
                      <button onClick={stopCamera} className="btn-secondary text-xs py-2 px-4"><i className="fas fa-stop mr-2"></i> Stop</button>
                    </>
                  )}
                </div>
              </div>
              {snapshot && (
                <div className="mt-4 p-4 bg-slate-50 border border-slate-200 rounded-xl text-center">
                  <h4 className="text-xs font-bold uppercase text-slate-500 mb-2">Captured Photo Preview</h4>
                  <img src={snapshot} alt="Snapshot" className="max-w-xs rounded-lg mx-auto border shadow-sm" />
                </div>
              )}
            </div>
          );
        }

        // 4. Mic Test Component
        function MicTest({ tabName, logActivity }) {
          const volumeBarRef = useRef(null);
          const [isRecording, setIsRecording] = useState(false);
          const [audioUrl, setAudioUrl] = useState(null);
          const audioContextRef = useRef(null);
          const streamRef = useRef(null);
          const mediaRecorderRef = useRef(null);
          const audioChunksRef = useRef([]);
          const requestRef = useRef(null);

          const startMic = async () => {
            try {
              const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
              streamRef.current = stream;

              const mediaRecorder = new MediaRecorder(stream);
              mediaRecorderRef.current = mediaRecorder;
              audioChunksRef.current = [];

              mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) audioChunksRef.current.push(event.data);
              };

              mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                setAudioUrl(URL.createObjectURL(audioBlob));
              };

              mediaRecorder.start();

              const audioContext = new (window.AudioContext || window.webkitAudioContext)();
              audioContextRef.current = audioContext;
              const analyser = audioContext.createAnalyser();
              const microphone = audioContext.createMediaStreamSource(stream);

              analyser.smoothingTimeConstant = 0.8;
              analyser.fftSize = 256;
              microphone.connect(analyser);

              const dataArray = new Uint8Array(analyser.frequencyBinCount);
              setIsRecording(true);
              logActivity(tabName, 'Microphone voice recording active');

              const updateVolume = () => {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                const average = sum / dataArray.length;
                const percentage = Math.min(100, Math.max(0, (average / 128) * 100));

                if (volumeBarRef.current) {
                  volumeBarRef.current.style.width = `${percentage}%`;
                }
                requestRef.current = requestAnimationFrame(updateVolume);
              };
              updateVolume();
            } catch (err) {
              logActivity(tabName, `Mic error: ${err.message}`);
            }
          };

          const stopMic = useCallback(() => {
            if (requestRef.current) cancelAnimationFrame(requestRef.current);
            if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
              mediaRecorderRef.current.stop();
            }
            if (audioContextRef.current) audioContextRef.current.close();
            if (streamRef.current) streamRef.current.getTracks().forEach(track => track.stop());
            if (volumeBarRef.current) volumeBarRef.current.style.width = '0%';
            setIsRecording(false);
          }, []);

          useEffect(() => {
            return () => stopMic();
          }, [stopMic]);

          return (
            <div className="flex flex-col items-center justify-center space-y-8 py-10">
              <div className="w-full max-w-xl">
                <div className="flex justify-between text-sm font-bold text-slate-400 uppercase tracking-widest mb-3">
                  <span>Quiet</span>
                  <span>Loud Input</span>
                </div>
                <div className="h-10 w-full bg-slate-100 rounded-full overflow-hidden shadow-inner border border-slate-200">
                  <div ref={volumeBarRef} className="h-full bg-indigo-500 transition-all duration-75 ease-out w-0"></div>
                </div>
              </div>

              <div className="flex space-x-4">
                {!isRecording ? (
                  <button onClick={startMic} className="btn-primary flex items-center"><i className="fas fa-microphone mr-2"></i> Record Voice</button>
                ) : (
                  <button onClick={stopMic} className="btn-secondary flex items-center"><i className="fas fa-stop mr-2"></i> Stop & Save Recording</button>
                )}
              </div>

              {audioUrl && (
                <div className="mt-6 p-4 bg-slate-50 border border-slate-200 rounded-xl text-center">
                  <h4 className="text-xs font-bold uppercase text-slate-500 mb-2">Playback Recorded Voice</h4>
                  <audio controls src={audioUrl} className="mx-auto"></audio>
                </div>
              )}
            </div>
          );
        }

        // 5. Speaker / Sound Test Component
        function SpeakerTest({ tabName, logActivity }) {
          const audioCtxRef = useRef(null);

          const playTone = (panValue, label) => {
            if (!audioCtxRef.current) {
              audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
            }
            const ctx = audioCtxRef.current;
            const oscillator = ctx.createOscillator();
            const panner = ctx.createStereoPanner();
            const gainNode = ctx.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.value = 440;
            panner.pan.value = panValue;

            gainNode.gain.setValueAtTime(0.8, ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);

            oscillator.connect(panner);
            panner.connect(gainNode);
            gainNode.connect(ctx.destination);

            oscillator.start();
            oscillator.stop(ctx.currentTime + 1.2);

            logActivity(tabName, `Audio checked: ${label}`);
          };

          return (
            <div className="flex flex-col items-center justify-center space-y-8 py-10">
              <p className="text-slate-600 text-center max-w-md font-medium">
                Test speaker balance by firing discrete test tones to the left channel, right channel, or balanced stereo.
              </p>
              <div className="flex space-x-6">
                <button onClick={() => playTone(-1, 'Left Speaker')} className="w-36 h-36 rounded-2xl bg-white hover:bg-slate-50 border-2 border-slate-200 hover:border-indigo-400 flex flex-col items-center justify-center shadow-sm group">
                  <i className="fas fa-volume-down text-4xl text-slate-400 group-hover:text-indigo-600 mb-3"></i>
                  <span className="font-bold text-slate-700 uppercase text-xs">Left Channel</span>
                </button>
                <button onClick={() => playTone(0, 'Center Stereo')} className="w-36 h-36 rounded-2xl bg-white hover:bg-slate-50 border-2 border-slate-200 hover:border-indigo-400 flex flex-col items-center justify-center shadow-sm group">
                  <i className="fas fa-volume-up text-4xl text-slate-400 group-hover:text-indigo-600 mb-3"></i>
                  <span className="font-bold text-slate-700 uppercase text-xs">Both (Stereo)</span>
                </button>
                <button onClick={() => playTone(1, 'Right Speaker')} className="w-36 h-36 rounded-2xl bg-white hover:bg-slate-50 border-2 border-slate-200 hover:border-indigo-400 flex flex-col items-center justify-center shadow-sm group">
                  <i className="fas fa-volume-down text-4xl text-slate-400 group-hover:text-indigo-600 mb-3"></i>
                  <span className="font-bold text-slate-700 uppercase text-xs">Right Channel</span>
                </button>
              </div>
            </div>
          );
        }

        // 6. Keyboard Test Component
        function KeyboardTest({ tabName, logActivity }) {
          const [pressedKeys, setPressedKeys] = useState(new Set());
          const [lastKey, setLastKey] = useState(null);

          useEffect(() => {
            const handleKeyDown = (e) => {
              e.preventDefault();
              setPressedKeys(prev => new Set(prev).add(e.code));
              setLastKey(e.code);
              logActivity(tabName, `Total keys validated: ${pressedKeys.size + 1}`);
            };
            window.addEventListener('keydown', handleKeyDown);
            return () => window.removeEventListener('keydown', handleKeyDown);
          }, [pressedKeys, tabName, logActivity]);

          const rows = [
            ['Escape', 'F1', 'F2', 'F3', 'F4', 'F5', 'F6', 'F7', 'F8', 'F9', 'F10', 'F11', 'F12'],
            ['Backquote', 'Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5', 'Digit6', 'Digit7', 'Digit8', 'Digit9', 'Digit0', 'Minus', 'Equal', 'Backspace'],
            ['Tab', 'KeyQ', 'KeyW', 'KeyE', 'KeyR', 'KeyT', 'KeyY', 'KeyU', 'KeyI', 'KeyO', 'KeyP', 'BracketLeft', 'BracketRight', 'Backslash'],
            ['CapsLock', 'KeyA', 'KeyS', 'KeyD', 'KeyF', 'KeyG', 'KeyH', 'KeyJ', 'KeyK', 'KeyL', 'Semicolon', 'Quote', 'Enter'],
            ['ShiftLeft', 'KeyZ', 'KeyX', 'KeyC', 'KeyV', 'KeyB', 'KeyN', 'KeyM', 'Comma', 'Period', 'Slash', 'ShiftRight'],
            ['ControlLeft', 'MetaLeft', 'AltLeft', 'Space', 'AltRight', 'ControlRight']
          ];

          const getKeyLabel = (code) => {
            const map = { 'Escape': 'Esc', 'Minus': '-', 'Equal': '=', 'Space': 'Space', 'Enter': 'Enter', 'Backspace': 'Bksp' };
            if (code.startsWith('Key')) return code.slice(3);
            if (code.startsWith('Digit')) return code.slice(5);
            return map[code] || code;
          };

          return (
            <div className="flex flex-col items-center">
              <div className="mb-6 h-12 flex items-center justify-center w-full bg-slate-50 border border-slate-200 rounded-lg text-sm font-mono font-bold text-slate-700 shadow-sm">
                {lastKey ? `Key Intercepted: ${lastKey}` : 'Press keys to verify layout matrix responsiveness...'}
              </div>
              <div className="bg-slate-100 p-5 rounded-xl border border-slate-300 w-full shadow-inner overflow-x-auto">
                <div className="min-w-[800px]">
                  {rows.map((row, i) => (
                    <div key={i} className="flex mb-1.5 justify-center">
                      {row.map((code) => {
                        const isPressed = pressedKeys.has(code);
                        let w = "w-11";
                        if (code === 'Space') w = "w-72";
                        if (['ShiftLeft', 'ShiftRight', 'Enter', 'Backspace', 'CapsLock', 'Tab'].includes(code)) w = "w-20";
                        return (
                          <div key={code} className={`h-10 mx-0.5 flex items-center justify-center rounded border font-mono text-xs font-semibold ${w} ${isPressed ? 'bg-indigo-600 text-white border-indigo-700' : 'bg-white text-slate-700 border-slate-300'}`}>
                            {getKeyLabel(code)}
                          </div>
                        );
                      })}
                    </div>
                  ))}
                </div>
              </div>
              <button onClick={() => setPressedKeys(new Set())} className="mt-6 text-xs text-indigo-600 hover:text-indigo-800 font-bold uppercase tracking-widest">
                Reset Key Matrix
              </button>
            </div>
          );
        }

        // 7. Mouse & Touchpad Test Component (with Lag Detection Pop-up)
        function MouseTouchpadTest({ tabName, logActivity }) {
          const [data, setData] = useState({ x: 0, y: 0, clicks: 0, scroll: 0 });
          const [lagWarning, setLagWarning] = useState(false);
          const lastTimeRef = useRef(performance.now());

          const handleMouseMove = (e) => {
            const now = performance.now();
            const delta = now - lastTimeRef.current;
            lastTimeRef.current = now;

            if (delta > 45) {
              setLagWarning(true);
              setTimeout(() => setLagWarning(false), 2500);
            }

            setData(p => ({ ...p, x: e.nativeEvent.offsetX, y: e.nativeEvent.offsetY }));
          };

          const handleClick = () => {
            setData(p => ({ ...p, clicks: p.clicks + 1 }));
            logActivity(tabName, 'Mouse/Touchpad click recorded');
          };

          const handleWheel = (e) => {
            e.preventDefault();
            setData(p => ({ ...p, scroll: p.scroll + (e.deltaY > 0 ? 1 : -1) }));
          };

          return (
            <div className="space-y-6">
              {lagWarning && (
                <div className="p-4 bg-amber-50 border border-amber-200 text-amber-800 rounded-xl font-bold flex items-center animate-bounce">
                  <i className="fas fa-exclamation-triangle mr-3 text-lg"></i>
                  <span>Lag Anomaly Detected! Frame latency spiked above normal thresholds.</span>
                </div>
              )}
              <div 
                className="w-full h-80 bg-slate-900 rounded-xl relative overflow-hidden cursor-crosshair shadow-inner border border-slate-800 flex items-center justify-center"
                onMouseMove={handleMouseMove}
                onClick={handleClick}
                onWheel={handleWheel}
              >
                <div className="absolute text-slate-700 font-black tracking-widest text-xl select-none pointer-events-none">
                  MOVE MOUSE / TEST TOUCHPAD GESTURES HERE
                </div>
                <div className="absolute top-0 bottom-0 border-l border-indigo-500/50 pointer-events-none" style={{ left: data.x }}></div>
                <div className="absolute left-0 right-0 border-t border-indigo-500/50 pointer-events-none" style={{ top: data.y }}></div>
              </div>
              <div className="grid grid-cols-3 gap-4">
                <InfoCard label="Pointer Coordinates" value={`X: ${data.x}, Y: ${data.y}`} />
                <InfoCard label="Total Clicks" value={data.clicks} />
                <InfoCard label="Scroll Ticks" value={data.scroll} />
              </div>
            </div>
          );
        }

        // 8. Display Test Component (Color, Gradient & Defect Check)
        function DisplayTest({ tabName, logActivity }) {
          const [mode, setMode] = useState(null);

          const modes = [
            { name: 'Pure White (Uniformity)', class: 'bg-white text-slate-800' },
            { name: 'Pitch Black (Backlight Bleed)', class: 'bg-black text-white' },
            { name: 'Vibrant Red', class: 'bg-red-600 text-white' },
            { name: 'Vibrant Green', class: 'bg-green-600 text-white' },
            { name: 'Vibrant Blue', class: 'bg-blue-600 text-white' },
            { name: 'Color Gradient Bar', class: 'bg-gradient-to-r from-red-500 via-green-500 to-blue-500 text-white' }
          ];

          if (mode) {
            return (
              <div className={`fixed inset-0 z-50 flex flex-col items-center justify-center cursor-pointer ${mode}`} onClick={() => setMode(null)}>
                <div className="bg-black/60 backdrop-blur px-6 py-3 rounded-xl text-white text-xs font-bold uppercase tracking-widest border border-white/20">
                  Click anywhere or press ESC to return to dashboard
                </div>
              </div>
            );
          }

          return (
            <div className="flex flex-col items-center justify-center space-y-8 py-10">
              <p className="text-slate-600 text-center max-w-md font-medium">
                Execute full-screen color variances and gradients to detect dead pixels, graininess, or backlight bleeding.
              </p>
              <div className="grid grid-cols-3 gap-4 w-full max-w-2xl">
                {modes.map(m => (
                  <button key={m.name} onClick={() => { setMode(m.class); logActivity(tabName, `Display test: ${m.name}`); }} className="p-6 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 shadow-sm font-bold text-slate-700 text-xs uppercase tracking-wider">
                    {m.name}
                  </button>
                ))}
              </div>
            </div>
          );
        }

        // 9. Ports Detection Component
        function PortsDetection({ tabName, logActivity }) {
          const [ports, setPorts] = useState([
            { name: 'Gigabit Ethernet Controller (RJ45)', status: 'Connected / Active Link', type: 'Wired LAN' },
            { name: 'USB-C SuperSpeed / Thunderbolt 4', status: 'Active Peripheral Bus', type: 'Universal Serial Bus' },
            { name: 'USB 3.2 Gen 1 Type-A Port', status: 'Ready / Idle', type: 'Peripheral' },
            { name: 'HDMI 2.1 Video Output Port', status: 'Display Standby', type: 'Video Output' },
            { name: '3.5mm Audio Combo Jack', status: 'Impedance Normal', type: 'Audio I/O' }
          ]);

          useEffect(() => {
            logActivity(tabName, 'Physical ports & ethernet controllers verified');
          }, [tabName, logActivity]);

          return (
            <div className="space-y-6">
              <p className="text-slate-600 font-medium">Detected hardware ports, controllers, and wired ethernet interfaces:</p>
              <div className="space-y-3">
                {ports.map((p, i) => (
                  <div key={i} className="p-5 bg-slate-50 rounded-xl border border-slate-200 flex justify-between items-center shadow-sm">
                    <div className="flex items-center space-x-4">
                      <i className="fas fa-plug text-indigo-600 text-xl"></i>
                      <div>
                        <h4 className="font-bold text-slate-800 text-sm">{p.name}</h4>
                        <p className="text-xs text-slate-500 font-semibold">{p.type}</p>
                      </div>
                    </div>
                    <span className="px-3 py-1 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-full">{p.status}</span>
                  </div>
                ))}
              </div>
            </div>
          );
        }

        // 10. SSD & RAM Health Component
        function SsdRamHealth({ tabName, logActivity }) {
          useEffect(() => {
            logActivity(tabName, `SSD Health: ${ssdHealthValue}%, RAM Integrity: Optimal`);
          }, [tabName, logActivity]);

          return (
            <div className="space-y-8">
              <div className="grid grid-cols-2 gap-6">
                <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 text-center shadow-sm">
                  <h3 className="text-slate-600 font-bold uppercase tracking-wider mb-2 text-sm">NVMe SSD SMART Health</h3>
                  <div className="text-5xl font-black text-emerald-600 mb-2">{ssdHealthValue}%</div>
                  <p className="text-sm text-slate-500 font-medium">Optimal Wear Level Remaining</p>
                </div>
                <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 text-center shadow-sm">
                  <h3 className="text-slate-600 font-bold uppercase tracking-wider mb-2 text-sm">RAM Memory Integrity</h3>
                  <div className="text-5xl font-black text-indigo-600 mb-2">100%</div>
                  <p className="text-sm text-slate-500 font-medium">Zero Bit Errors Detected</p>
                </div>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <InfoCard label="SSD Interface" value="PCIe NVMe 4.0 x4" />
                <InfoCard label="RAM Frequency" value="5600 MHz Dual Channel" />
              </div>
            </div>
          );
        }

        // 11. Thermal & CPU Load Component (Heating Telemetry)
        function ThermalCpuTest({ tabName, logActivity }) {
          const [isRunning, setIsRunning] = useState(false);
          const [temp, setTemp] = useState(42);
          const workerRef = useRef(null);

          const startTest = () => {
            const blob = new Blob([workerCode], { type: 'application/javascript' });
            const worker = new Worker(URL.createObjectURL(blob));
            worker.postMessage('start');
            workerRef.current = worker;
            setIsRunning(true);
            setTemp(78);
            logActivity(tabName, 'CPU stress test and thermal load initiated');
          };

          const stopTest = useCallback(() => {
            if (workerRef.current) {
              workerRef.current.terminate();
              workerRef.current = null;
            }
            setIsRunning(false);
            setTemp(45);
            logActivity(tabName, 'CPU stress test stopped, temperature cooling');
          }, []);

          useEffect(() => {
            return () => stopTest();
          }, [stopTest]);

          return (
            <div className="flex flex-col items-center justify-center space-y-8 py-10">
              <div className="text-center max-w-lg">
                <i className={`fas fa-temperature-high text-6xl mb-4 ${temp > 70 ? 'text-amber-500 animate-pulse' : 'text-slate-400'}`}></i>
                <h3 className="text-xl font-bold text-slate-800 mb-2">Processor Temperature & Load</h3>
                <p className="text-slate-600 text-sm font-medium">
                  Spins background threads to evaluate thermal dissipation, fan cooling efficiency, and heat management.
                </p>
              </div>
              <div className="text-4xl font-mono font-black text-indigo-600">{temp}°C</div>
              <div>
                {!isRunning ? (
                  <button onClick={startTest} className="btn-primary flex items-center"><i className="fas fa-play mr-2"></i> Start CPU Load Test</button>
                ) : (
                  <button onClick={stopTest} className="btn-secondary flex items-center"><i className="fas fa-stop mr-2"></i> Stop Load Test</button>
                )}
              </div>
            </div>
          );
        }

        // 12. Generate Report Component
        function GenerateReport({ results }) {
          return (
            <div className="space-y-6 print-section">
              <div className="flex justify-between items-center border-b border-slate-200 pb-4">
                <div>
                  <h3 className="text-2xl font-black text-slate-800">Laptop Analyzer Diagnostic Summary</h3>
                  <p className="text-xs font-bold text-slate-400 uppercase tracking-wider mt-1">Generated: {new Date().toLocaleString()}</p>
                </div>
                <button onClick={() => window.print()} className="btn-primary no-print flex items-center text-xs py-2 px-4">
                  <i className="fas fa-print mr-2"></i> Print / Save PDF
                </button>
              </div>
              <div className="space-y-3">
                {Object.keys(results).length === 0 ? (
                  <p className="text-slate-500 font-medium">No tests executed yet. Navigate through tabs to record test telemetry.</p>
                ) : (
                  Object.entries(results).map(([test, data]) => (
                    <div key={test} className="p-4 bg-slate-50 rounded-xl border border-slate-200 flex justify-between items-center shadow-sm">
                      <div>
                        <h4 className="font-bold text-slate-800 text-sm">{test}</h4>
                        <p className="text-xs text-slate-500 mt-0.5">{data.details || 'Test verified successfully'}</p>
                      </div>
                      <div className="text-right">
                        <span className="px-3 py-1 bg-indigo-50 text-indigo-700 text-xs font-bold rounded-full border border-indigo-200">Passed</span>
                        <p className="text-[10px] text-slate-400 mt-1">{data.time}</p>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
